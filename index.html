<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Weather App</title>
		<link
			rel="shortcut icon"
			href="./Image/cloud.png"
			type="image/x-icon"
		/>
		<link rel="stylesheet" href="./font-awesome-pro-5/css/all.min.css" />
		<link
			rel="stylesheet"
			href="./node_modules/swiper/swiper-bundle.min.css"
		/>
		<link rel="stylesheet" href="./src/output.css" />
		<script defer type="module" src="./dist/controller.js"></script>
	</head>
	<body>
		<section
			class="container max-w-full grid xs:grid-rows-[80rem,auto] xs:grid-cols-1 sm:grid-rows-[80rem,auto] sm:grid-cols-1 md:grid-rows-[80rem,auto] md:grid-cols-1 lg:grid-rows-[80rem,auto] lg:grid-cols-1 xl:grid-rows-[80rem,auto] xl:grid-cols-1 grid-cols-[50rem,minmax(100rem,auto)] min-h-screen"
		>
			<!-- Location Found Modal -->
			<div
				id="modalEl"
				tabindex="-1"
				aria-hidden="true"
				class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
			>
				<div class="relative p-4 w-full max-w-md max-h-full">
					<!-- Modal content -->
					<div
						class="modal-content relative bg-white rounded-lg shadow-2xl dark:bg-gray-700 overflow-y-scroll"
					>
						<!-- Modal header -->
						<div
							class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200"
						>
							<h3
								class="text-lg font-semibold text-gray-900 dark:text-white"
							>
								Locations founds
							</h3>
							<button
								type="button"
								class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm h-8 w-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
								data-modal-toggle="modalEl"
							>
								<svg
									class="w-3 h-3"
									aria-hidden="true"
									xmlns="http://www.w3.org/2000/svg"
									fill="none"
									viewBox="0 0 14 14"
								>
									<path
										stroke="currentColor"
										stroke-linecap="round"
										stroke-linejoin="round"
										stroke-width="2"
										d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
									/>
								</svg>
								<span class="sr-only">Close modal</span>
							</button>
						</div>
						<!-- Modal body -->
						<div class="p-4 md:p-5">
							<p class="text-gray-500 dark:text-gray-400 mb-4">
								Select your preferred location:
							</p>
							<ul class="modal-body space-y-4 mb-4"></ul>
						</div>
					</div>
				</div>
			</div>

			<!-- Error Modal -->
			<div
				id="default-modal"
				tabindex="-1"
				aria-hidden="true"
				class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
			>
				<div class="relative p-4 w-full max-w-2xl max-h-full">
					<!-- Modal content -->
					<div
						class="relative bg-white rounded-lg shadow-2xl dark:bg-gray-700"
					>
						<!-- Modal header -->
						<div
							class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200"
						>
							<h3
								class="text-xl font-semibold text-gray-900 dark:text-white"
							>
								Something seems not right!
							</h3>
							<button
								type="button"
								class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
								data-modal-hide="default-modal"
							>
								<svg
									class="w-3 h-3"
									aria-hidden="true"
									xmlns="http://www.w3.org/2000/svg"
									fill="none"
									viewBox="0 0 14 14"
								>
									<path
										stroke="currentColor"
										stroke-linecap="round"
										stroke-linejoin="round"
										stroke-width="2"
										d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
									/>
								</svg>
								<span class="sr-only">Close modal</span>
							</button>
						</div>
						<!-- Modal body -->
						<div
							class="modal-body-error p-4 md:p-5 space-y-4"
						></div>
						<!-- Modal footer -->
						<div
							class="flex items-center p-4 md:p-5 border-t border-gray-200 rounded-b dark:border-gray-600"
						>
							<button
								data-modal-hide="default-modal"
								type="button"
								class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
							>
								Close
							</button>
						</div>
					</div>
				</div>
			</div>

			<!-- Copyright Modal -->
			<div
				id="static-modal"
				data-modal-backdrop="static"
				tabindex="-1"
				aria-hidden="true"
				class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
			>
				<div class="relative p-4 w-full max-w-2xl max-h-full">
					<!-- Modal content -->
					<div
						class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700"
					>
						<!-- Modal header -->
						<div
							class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200"
						>
							<h3
								class="text-xl font-semibold text-gray-900 dark:text-white"
							>
								Welcome to the Weather-Mini Application
							</h3>
							<button
								type="button"
								class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
								data-modal-hide="static-modal"
							>
								<svg
									class="w-3 h-3"
									aria-hidden="true"
									xmlns="http://www.w3.org/2000/svg"
									fill="none"
									viewBox="0 0 14 14"
								>
									<path
										stroke="currentColor"
										stroke-linecap="round"
										stroke-linejoin="round"
										stroke-width="2"
										d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
									/>
								</svg>
								<span class="sr-only">Close modal</span>
							</button>
						</div>
						<!-- Modal body -->
						<div class="p-4 md:p-5 space-y-4 text-center">
							<p
								class="text-xl leading-relaxed text-gray-500 dark:text-gray-400"
							>
								Start searching your favorite locations...
							</p>
							<p
								class="text-xl leading-relaxed text-gray-500 dark:text-gray-400"
							>
								Developed and Designed by
								<strong class="text-white">Zayed Uddin</strong>.
								All Rights Reserved 2025.
							</p>
						</div>
						<!-- Modal footer -->
						<div
							class="flex items-center p-4 md:p-5 border-t border-gray-200 rounded-b dark:border-gray-600"
						>
							<button
								data-modal-hide="static-modal"
								type="button"
								class="py-2.5 px-5 ms-3 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700"
							>
								Close
							</button>
						</div>
					</div>
				</div>
			</div>
			<aside class="side__bar flex flex-col relative z-10"></aside>
			<main
				class="dashboard flex flex-col gap-y-12 bg-[var(--background-color)] p-14"
			></main>
		</section>
		<script src="./font-awesome-pro-5/js/pro.min.js"></script>
		<script src="./node_modules/swiper/swiper-bundle.min.js"></script>
		<script>
			function initializeSwipers() {
				document.querySelectorAll(".mySwiper").forEach((slider) => {
					if (!slider.dataset.swiperInitialized) {
						new Swiper(slider, {
							slidesPerView: "auto",
							loop: true,
							centeredSlides: true,
							spaceBetween: 30,
							grabCursor: true,
							autoplay: {
								delay: 2500,
								disableOnInteraction: false,
							},
							keyboard: {
								enabled: true,
							},
							pagination: {
								el: slider.querySelector(".swiper-pagination"),
								clickable: true,
							},
						});

						slider.dataset.swiperInitialized = "true";
					}
				});
			}

			// Initialize Swiper for existing sliders in the DOM
			initializeSwipers();

			const observer = new MutationObserver(() => {
				initializeSwipers();
			});

			observer.observe(document.body, { childList: true, subtree: true });
		</script>
	</body>
</html>
