<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Weather App</title>
		<link
			rel="shortcut icon"
			href="./Image/cloud.png"
			type="image/x-icon"
		/>
		<link rel="stylesheet" href="./font-awesome-pro-5/css/all.min.css" />
		<link
			rel="stylesheet"
			href="./node_modules/swiper/swiper-bundle.min.css"
		/>
		<link rel="stylesheet" href="./src/output.css" />

		<script defer type="module" src="./dist/controller.js"></script>
	</head>
	<body>
		<section
			class="container max-w-full grid grid-cols-[50rem,minmax(100rem,auto)] min-h-screen"
		>
			<aside class="side__bar flex flex-col relative z-50"></aside>
			<main class="dashboard bg-[var(--background-color)] p-14"></main>
		</section>
		<script src="./font-awesome-pro-5/js/pro.min.js"></script>
		<script src="./node_modules/swiper/swiper-bundle.min.js"></script>
		<script>
			function initializeSwipers() {
				document.querySelectorAll(".mySwiper").forEach((slider) => {
					if (!slider.dataset.swiperInitialized) {
						new Swiper(slider, {
							slidesPerView: "auto",
							loop: true,
							centeredSlides: true,
							spaceBetween: 30,
							grabCursor: true,
							autoplay: {
								delay: 2500,
								disableOnInteraction: false,
							},
							keyboard: {
								enabled: true,
							},
							pagination: {
								el: slider.querySelector(".swiper-pagination"),
								clickable: true,
							},
						});

						slider.dataset.swiperInitialized = "true";
					}
				});
			}

			// Initialize Swiper for existing sliders in the DOM
			initializeSwipers();

			const observer = new MutationObserver(() => {
				initializeSwipers();
			});

			observer.observe(document.body, { childList: true, subtree: true });
		</script>
	</body>
</html>
